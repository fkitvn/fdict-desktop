name: Release

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.3.0
          package-manager-cache: false
      - run: node scripts/app-version.mjs

  release:
    needs: version
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26.3.0
          package-manager-cache: false

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node scripts/app-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already released
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.released.outputs.exists != 'true'
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate
          $shim = Join-Path $env:RUNNER_TEMP "yarn4"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -Path (Join-Path $shim "yarn.cmd") -Value "@echo off`r`ncorepack yarn %*`r`n" -Encoding ascii
          Set-Content -Path (Join-Path $shim "yarn.ps1") -Value "corepack yarn @args`r`n" -Encoding ascii
          [IO.File]::WriteAllText((Join-Path $shim "yarn"), "#!/bin/sh`nexec corepack yarn `"`$@`"`n")
          $env:Path = "$shim;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $shim
          $version = (corepack yarn --version).Trim()
          if ($version -notlike "4.*") { throw "Yarn $version" }
          corepack yarn install --immutable

      - name: Build and publish the GitHub release
        if: steps.released.outputs.exists != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDICT_BUILD_ENV: production
        with:
          tagName: v__VERSION__
          releaseName: Fdict v__VERSION__
          releaseBody: Bản máy tính Fdict.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Record the download link
        shell: pwsh
        env:
          DESKTOP_PUBLISH_TOKEN: ${{ secrets.DESKTOP_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not $env:DESKTOP_PUBLISH_TOKEN) { throw "Thiếu secret DESKTOP_PUBLISH_TOKEN." }
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*$env:VERSION*setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $name = $exe.Name
            $bytes = $exe.Length
          } else {
            $release = gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            $asset = @($release.assets) | Where-Object { $_.name -like "*$env:VERSION*setup.exe" } | Select-Object -First 1
            if (-not $asset) { throw "Không thấy bộ cài." }
            $name = $asset.name
            $bytes = $asset.size
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/$name"
          $body = @{
            version = $env:VERSION
            environment = "production"
            notes = "Bản máy tính Fdict."
            url = $url
            bytes = $bytes
          } | ConvertTo-Json -Compress
          $jsonPath = Join-Path $env:RUNNER_TEMP "desktop-publish.json"
          [System.IO.File]::WriteAllText($jsonPath, $body, [System.Text.UTF8Encoding]::new($false))
          $ok = $false
          foreach ($attempt in 1..5) {
            $result = & curl.exe --silent --show-error --http1.1 --fail-with-body -X POST "https://dict.fkit.vn/api/desktop/publish" -H "content-type: application/json" -H "x-desktop-token: $($env:DESKTOP_PUBLISH_TOKEN)" -H "user-agent: fdict-desktop-ci" --data-binary "@$jsonPath" 2>&1
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Output "Lần $attempt : $result"
            Start-Sleep -Seconds (4 * $attempt)
          }
          if (-not $ok) { throw "Không ghi được link tải xuống." }
          Write-Output $url
