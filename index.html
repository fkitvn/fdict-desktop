<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-full.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FDict</title>
    <script>
      (function () {
        var saved = localStorage.getItem("fdict-theme");
        var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = mode === "system" ? (dark ? "dark" : "light") : mode;
      })();
    </script>
    <style>
      html, body { margin: 0; background: #12161c; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f6f3ec; }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
